<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090c"><title>تأیید شماره | مدرسه‌یار</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><div class="ambient"></div><header class="topbar"><a class="brand" href="login.html"><span class="logo">م</span><span><b>مدرسه‌یار</b><small>SCHOOL ELECTION</small></span></a><span class="online"><i class="pulse-dot"></i> تأیید شماره تماس</span></header>
<main class="verify-wrap"><section class="login-card verify-card"><div class="verify-icon">⌑</div><span class="eyebrow center">مرحله دوم · تأیید هویت نمایشی</span><h1>کد تأیید رو وارد کن</h1><p class="muted">کد چهاررقمی برای <b id="phoneText">شماره شما</b></p><form id="verifyForm"><div class="otp-boxes" dir="ltr"><input class="otp" aria-label="رقم اول" maxlength="1" inputmode="numeric" autocomplete="one-time-code"><input class="otp" aria-label="رقم دوم" maxlength="1" inputmode="numeric"><input class="otp" aria-label="رقم سوم" maxlength="1" inputmode="numeric"><input class="otp" aria-label="رقم چهارم" maxlength="1" inputmode="numeric"></div><div id="verifyError" class="error" aria-live="polite"></div><button class="primary-btn" type="submit">تأیید و ورود به داشبورد <b>←</b></button></form><div class="resend">کد ارسال نشده؟ <button id="resendCode" type="button">نمایش دوباره کد آزمایشی</button></div><div id="demoCode" class="demo-code hidden">کد نمایشی شما: <b>۱۲۳۴</b></div><button id="backBtn" class="back-btn" type="button">← بازگشت و اصلاح اطلاعات</button><footer>کد ثابت صرفاً برای تست رابط کاربری است.</footer></section></main><script src="verify.js"></script></body></html>
